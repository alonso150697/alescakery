<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ales Cakery | Catálogo Digital</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="bg-light">

  <!-- Barra Superior de Navegación -->
  <header class="top-bar">
    <div class="top-bar-content">
      <span class="brand-text">Ales Cakery</span>
      <a href="https://wa.me/51986730375?text=Hola%20Ales%20Cakery,%20quisiera%20hacer%20una%20consulta" target="_blank" class="btn-wsp-top">
        WhatsApp
      </a>
    </div>
  </header>

  <main class="container">
    <!-- Perfil del Negocio / Bio estilo Instagram -->
    <section class="profile-header">
      <div class="profile-avatar">
        <img src="logo_final.jpg" alt="Ales Cakery Logo" onerror="this.style.display='none'">
      </div>
      <div class="profile-info">
        <h1>Ales Cakery</h1>
        <p class="username">@alescakery</p>
        <ul class="bio-list">
          <li>✨ Pastelería artesanal hecha a pedido</li>
          <li>🎂 Especialistas en <strong>Tortas Personalizadas</strong></li>
          <li>🕒 Pedidos con mínimo 48 horas de anticipación</li>
          <li>🛵 Delivery y recojo en taller</li>
        </ul>
      </div>
    </section>

    <!-- Buscador en tiempo real -->
    <div class="search-box">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input type="text" id="searchInput" placeholder="Buscar tortas, cheesecakes, bocaditos...">
    </div>

    <!-- Categorías / Filtros (Se generan dinámicamente desde el Excel) -->
    <nav class="categories-tab">
      <button class="tab-btn active" data-category="todos">Todos</button>
    </nav>

    <!-- Grilla de productos dinámicos -->
    <div id="productGrid" class="product-grid"></div>
  </main>

  <!-- Pie de página con Redes Sociales -->
  <footer class="main-footer">
    <div class="social-links">
      <!-- Instagram -->
      <a href="https://www.instagram.com/alescakery/?hl=es/" target="_blank" rel="noopener noreferrer" aria-label="Instagram">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="5" ry="5"/><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"/><line x1="17.5" y1="6.5" x2="17.51" y2="6.5"/></svg>
      </a>
      <!-- Facebook -->
      <a href="https://www.facebook.com/AlesCakery/?locale=es_LA" target="_blank" rel="noopener noreferrer" aria-label="Facebook">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 2h-3a5 5 0 0 0-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 0 1 1-1h3z"/></svg>
      </a>
      <!-- WhatsApp -->
      <a href="https://wa.me/51986730375?text=Hola%20Ales%20Cakery,%20quisiera%20hacer%20una%20consulta" target="_blank" rel="noopener noreferrer" aria-label="WhatsApp">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
      </a>
    </div>
    <p>© 2026 Ales Cakery - Repostería Fina & Personalizada</p>
  </footer>
